<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0d7de;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            text-align: left;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
        }

        .greeting {
            font-size: 3rem;
            font-weight: bold;
            color: #2c3e50;
            min-height: 4rem;
            margin-bottom: 2rem;
            line-height: 1.2;
        }

        .bio {
            font-size: 1.1rem;
            color: #2c3e50;
            line-height: 1.8;
            opacity: 0;
            animation: fadeIn 0.3s ease-in forwards;
            text-align: left;
            max-width: 600px;
        }

        .bio-intro {
            margin-bottom: 2rem;
        }

        .bio-bullets {
            opacity: 0;
            animation: fadeIn 0.5s ease-in forwards;
        }

        .bio-bullets ul {
            list-style: disc;
            padding-left: 25px;
            margin: 0;
        }

        .bio-bullets li {
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        .bio-bullets a {
            color: #2c3e50;
            text-decoration: none;
            border-bottom: 1px solid #2c3e50;
        }

        .bio-bullets a:hover {
            background-color: rgba(44, 62, 80, 0.1);
        }

        .bio a {
            color: #2c3e50;
            text-decoration: none;
            border-bottom: 1px solid #2c3e50;
        }

        .bio a:hover {
            background-color: rgba(44, 62, 80, 0.1);
        }

        .publications-section {
            margin-top: 3rem;
            opacity: 0;
            animation: fadeIn 0.5s ease-in forwards;
        }

        .publications-section h2 {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }

        .publication-item {
            margin-bottom: 2rem;
        }

        .publication-title {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 0.3rem;
            display: flex;
            justify-content: space-between;
            gap: 1rem;
        }

        .publication-year {
            white-space: nowrap;
            color: #2c3e50;
        }

        .publication-venue {
            font-size: 0.95rem;
            color: #2c3e50;
            font-style: italic;
            margin-bottom: 0.5rem;
        }

        .publication-description {
            font-size: 0.95rem;
            color: #2c3e50;
            margin-left: 1rem;
        }

        .publication-description::before {
            content: "- ";
            margin-left: -1rem;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: #2c3e50;
            margin-left: 3px;
            animation: blink 0.5s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .bio.typing .cursor {
            animation: blink 0.7s infinite;
        }

        .bio.done .cursor {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="greeting" id="greeting"></div>
        <div class="bio" id="bio">
            <div class="bio-intro" id="bio-intro"></div>
            <div class="bio-bullets" id="bio-bullets"></div>
        </div>
        <div class="publications-section" id="publications-section"></div>
    </div>

    <script>
        const greetingText = "Hi! I'm Navya";
        const bioIntroText = "I'm interested in building interpretable models for biology and clinical AI.";
        const speed = 40; // milliseconds per character
        const bioDelay = 300; // delay before bio starts typing (after greeting finishes)
        const bulletsDelay = 500; // delay before bullets appear (after bio intro finishes)
        const publicationsDelay = 1000; // delay before publications appear

        let greetingIndex = 0;
        let bioIndex = 0;

        const greetingElement = document.getElementById('greeting');
        const bioIntroElement = document.getElementById('bio-intro');
        const bioBulletsElement = document.getElementById('bio-bullets');
        const publicationsElement = document.getElementById('publications-section');

        // Typewriter effect for greeting
        function typeGreeting() {
            if (greetingIndex < greetingText.length) {
                greetingElement.textContent += greetingText[greetingIndex];
                greetingIndex++;
                setTimeout(typeGreeting, speed);
            } else {
                // Greeting finished, start bio after delay
                greetingElement.innerHTML = greetingText;
                setTimeout(startBioIntro, bioDelay);
            }
        }

        // Typewriter effect for bio intro
        function startBioIntro() {
            typeBioIntro();
        }

        function typeBioIntro() {
            if (bioIndex < bioIntroText.length) {
                bioIntroElement.textContent += bioIntroText[bioIndex];
                bioIndex++;
                setTimeout(typeBioIntro, speed);
            } else {
                // Bio intro finished, show bullets after delay
                bioIntroElement.innerHTML = bioIntroText;
                setTimeout(showBullets, bulletsDelay);
            }
        }

        function showBullets() {
            bioBulletsElement.innerHTML = `
                <ul>
                    <li>I am a Computer Science major and Math minor at Georgia Tech, supported by the <a href="https://stampsps.gatech.edu/" target="_blank">Stamps Presidents Scholarship</a>.</li>
                    <li>I work on Bio ML with <a href="https://www.chatterjeelab.com/" target="_blank">Professor Pranam Chatterjee</a> at UPenn and <a href="https://amirmohan.github.io/" target="_blank">Professor Amirali Aghazadeh</a> at GT.</li>
                    <li>In my free time I like to read, write, and run. <a href="blog.html">Check out my blog!</a></li>
                </ul>
            `;
            setTimeout(showPublications, publicationsDelay);
        }

        function showPublications() {
            publicationsElement.innerHTML = `
                <h2>Publications</h2>
                <div class="publication-item">
                    <div class="publication-title">
                        <span>Phylogenetically Robust Antiviral Peptide Design Against Heterogeneous Evolutionary Trajectories</span>
                        <span class="publication-year">2026</span>
                    </div>
                    <div class="publication-venue">Chatterjee Lab at UPenn, Accepted to International Conference on Machine Learning (ICML) 2026 GenBio Workshop, Spotlight</div>
                    <div class="publication-description">Implemented discrete flow matching, Gibbs sampling, and coevolutionary modeling to optimize binding across future viral escape variants for HIV-1 Protease</div>
                </div>

                <div class="publication-item">
                    <div class="publication-title">
                        <span>Design of Biodegradable Polyesters with Generative AI</span>
                        <span class="publication-year">2024</span>
                    </div>
                    <div class="publication-venue">2024 Materials Research Society Fall Meeting & Journal of Materials Science & Chemical Engineering (Vol 12, No 8)</div>
                    <div class="publication-description">Built machine learning based virtual screening methods to design sustainable polymer candidates with 85% accuracy. Developed synthesis pathways for the best performing structures using neural networks</div>
                </div>

                <div class="publication-item">
                    <div class="publication-title">
                        <span>AI-Based Prediction of High-Risk Pregnancies</span>
                        <span class="publication-year">2023</span>
                    </div>
                    <div class="publication-venue">2023 Emory Southeastern Pediatric Research Conference</div>
                    <div class="publication-description">Built regularized regression and boosted tree (non-linear) models to quantify the risk of a pregnancy based on clinical and demographic factors with 96% accuracy, integrated results into a mobile app</div>
                </div>

                <div class="publication-item">
                    <div class="publication-title">
                        <span>Machine Learning Models to Monitor the Mental and Physical Progression of Anorexia Nervosa</span>
                        <span class="publication-year">2023</span>
                    </div>
                    <div class="publication-venue">2023 Emory Southeastern Pediatric Research Conference</div>
                    <div class="publication-description">Developed feed forward network models to quantify risk of Anorexia based on DSM-5 clinical criteria, created a lab test to identify physiological warning signs</div>
                </div>
            `;
        }

        // Start the animation when page loads
        window.addEventListener('load', typeGreeting);
    </script>
</body>
</html>
